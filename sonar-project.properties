# SonarQube Cloud analysis config (organization + project key are passed in .github/workflows/build.yml)
sonar.projectName=Confy

# What to analyze
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/test/**,**/*.test.ts,**/*.test.tsx

# Never analyze vendored, generated, or build output
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/test/**,**/*.test.ts,**/*.test.tsx,seed/out/**

# Coverage reports are produced by `pnpm test:coverage` (vitest, v8) before the scan
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,seed/coverage/lcov.info,apps/worker/coverage/lcov.info,apps/web/coverage/lcov.info,packages/shared/coverage/lcov.info

# Not unit-tested by design: process entrypoints, OTel bootstrap, config files, Next.js framework glue
sonar.coverage.exclusions=**/test/**,**/*.config.*,**/main.ts,packages/shared/src/telemetry/register.ts,packages/shared/src/es/setup-cli.ts,seed/src/cli.ts,seed/src/load-cli.ts,seed/src/demand-cli.ts,apps/web/src/app/**,apps/web/src/features/**,apps/web/src/components/**,apps/web/src/lib/utils.ts,apps/web/src/hooks/**,apps/web/src/lib/persona/**,apps/web/src/lib/telemetry/**
