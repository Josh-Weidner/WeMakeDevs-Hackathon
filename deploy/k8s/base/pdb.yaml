# Radar Checks: missingPDB. Keep one pod of each multi-replica Deployment up during voluntary
# disruptions (node drain, cluster upgrade).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: confy }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: confy }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: web }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: confy }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
