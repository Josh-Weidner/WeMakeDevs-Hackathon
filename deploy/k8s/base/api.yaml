apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: confy
    app.kubernetes.io/version: IMAGE_TAG
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: confy
        app.kubernetes.io/version: IMAGE_TAG
    spec:
      # Radar Checks: none of the apps call the Kubernetes API.
      automountServiceAccountToken: false
      # Radar Checks: missingTopologySpread. ScheduleAnyway so a single-node cluster still schedules.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: api }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: confy-api:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - secretRef: { name: confy-secrets }
            - configMapRef: { name: confy-config }
          env:
            - { name: OTEL_SERVICE_NAME, value: confy-api }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=confy,service.version=IMAGE_TAG,deployment.environment=kind" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: confy
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - { name: http, port: 4000, targetPort: http }
