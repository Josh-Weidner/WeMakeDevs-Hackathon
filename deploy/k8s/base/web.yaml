apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: confy
    app.kubernetes.io/version: IMAGE_TAG
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: confy
        app.kubernetes.io/version: IMAGE_TAG
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: confy-web:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: API_BASE_URL
              valueFrom: { configMapKeyRef: { name: confy-config, key: API_BASE_URL } }
            # Browser RUM (optional): public ingest-only Dash0 token; RUM is skipped when absent.
            - name: DASH0_RUM_ENDPOINT
              valueFrom: { secretKeyRef: { name: confy-secrets, key: DASH0_RUM_ENDPOINT, optional: true } }
            - name: DASH0_RUM_TOKEN
              valueFrom: { secretKeyRef: { name: confy-secrets, key: DASH0_RUM_TOKEN, optional: true } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # Next.js writes its runtime cache here; everything else stays read-only.
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
      volumes:
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: confy
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - { name: http, port: 3000, targetPort: http }
