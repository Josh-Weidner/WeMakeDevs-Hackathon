# DEMO CHAOS: "It's keynote time and everyone opens the app."
# Starves the worker of memory so it gets OOMKilled → CrashLoopBackOff.
# Radar's AI Investigation should find the cause; Dash0 shows the error spike / job backlog.
# Apply: make break-worker   Revert: make fix-worker
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 48Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 48Mi
